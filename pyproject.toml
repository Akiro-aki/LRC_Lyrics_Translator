[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2lrc"
version = "0.1.0"
description = "Audio file -> synced lyrics -> translated .lrc"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "requests>=2.31",
    "langdetect>=1.0.9",
    "pykakasi>=2.2",
    "pypinyin>=0.49",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
audio2lrc = "audio2lrc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
